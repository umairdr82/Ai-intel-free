<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1117"><link rel="manifest" href="manifest.webmanifest"><title>AI Intel</title><style>body{margin:0;background:#0b1117;color:#e8f5f1;font:16px system-ui}header{padding:22px;background:#15242a;position:sticky;top:0}h1{margin:0;color:#65e5b2}main{max-width:800px;margin:auto;padding:16px}article{background:#14242a;border:1px solid #31504b;border-radius:14px;margin:12px 0;padding:16px}a{color:#7be8bb}input,select,button{background:#1c3338;color:white;border:1px solid #45645c;padding:11px;border-radius:8px}input{width:90%;margin:12px 0}.meta{color:#a1bbb1;font-size:12px}.summary{color:#b9cfc6}.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:12px}</style></head><body><header><h1>◉ AI INTEL</h1><span class="meta">Source-first AI intelligence · Free edition</span></header><main><div id="status">Loading feeds…</div><input id="q" placeholder="Search AI news"><select id="filter"><option value="all">All</option><option value="Official">Official</option><option value="Preprint">Research</option><option value="saved">Following</option></select><section id="items"></section><p class="meta">Stories are public source excerpts, not independent fact checks. Ratings are heuristic. No X or push notifications.</p></main><script>let stories=[];const saved=()=>JSON.parse(localStorage.getItem('follow')||'[]');const esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function follow(id){let a=saved();a=a.includes(id)?a.filter(x=>x!==id):[...a,id];localStorage.setItem('follow',JSON.stringify(a));render()}function toggle(id){let x=document.getElementById('s'+id);x.hidden=!x.hidden}function render(){let q=document.getElementById('q').value.toLowerCase(),f=document.getElementById('filter').value;let a=stories.filter(s=>(s.title+' '+s.source+' '+s.summary).toLowerCase().includes(q)&&(f==='all'||f==='saved'&&saved().includes(s.id)||s.source_type===f));document.getElementById('items').innerHTML=a.length?a.slice(0,100).map(s=>'<article><div class="meta">'+esc(s.source)+' · '+new Date(s.published_at).toLocaleDateString()+' · '+esc(s.status)+' · '+'★'.repeat(s.importance)+'</div><h3><a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.title)+'</a></h3><p class="summary" id="s'+s.id+'" hidden>'+esc(s.summary||'No source excerpt available')+'</p><div class="actions"><button onclick="toggle(\''+s.id+'\')">Source summary</button><a href="'+esc(s.url)+'" target="_blank" rel="noopener">Dig deeper ↗</a><a href="https://www.google.com/search?q='+encodeURIComponent(s.title)+'" target="_blank" rel="noopener">Research ↗</a><button onclick="follow(\''+s.id+'\')">'+(saved().includes(s.id)?'✓ Following':'+ Follow')+'</button></div></article>').join(''):'<p>No stories available yet. The first collection may still be pending.</p>'}document.getElementById('q').oninput=render;document.getElementById('filter').onchange=render;fetch('data/stories.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{stories=d.stories||[];document.getElementById('status').textContent=d.updated_at?'Updated '+new Date(d.updated_at).toLocaleString()+' · '+stories.length+' stories · '+d.sources_checked+' feeds':'Awaiting first news collection';render()}).catch(e=>document.getElementById('status').textContent='Feed error: '+e.message);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
